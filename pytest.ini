[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    slow: tests that train a model or touch large data (deselect with '-m "not slow"')
    gpu: tests that require a CUDA device
    network: tests that need to download a pretrained model
filterwarnings =
    ignore::DeprecationWarning
