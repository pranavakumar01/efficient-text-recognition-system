# ===========================================================================
# Stage 1 of the research experiment.
#
# Self-supervised pretraining of the CNN encoder with SimCLR on the UNLABELED
# image pool.  No transcription labels are touched here.
#
#   python scripts/pretrain_simclr.py --config configs/experiments/simclr_pretrain.yaml
#
# Produces: artifacts/checkpoints/simclr_pretrain/encoder_best.pt
# ===========================================================================
extends: default.yaml

name: simclr_pretrain

train:
  # 12 epochs is a hardware budget, not an optimum. On the RTX 2050 this
  # project was developed on (4 GB, 35 W power-limited, ~0.8 TFLOPS effective)
  # one epoch over the 11,400-image pool takes ~5 minutes, so this is ~1 hour.
  # SimCLR keeps improving well past this point; on a desktop GPU, raise it to
  # 50-100 and expect a larger gain in the downstream comparison.
  epochs: 12
  batch_size: 64            # larger batch => more negatives => better NT-Xent
  learning_rate: 0.001
  weight_decay: 0.000001
  scheduler: cosine
  warmup_epochs: 1
  monitor: train_loss
  monitor_mode: min
  early_stopping_patience: 10
  checkpoint_dir: artifacts/checkpoints/simclr_pretrain

simclr:
  temperature: 0.1
  projection_dim: 128
