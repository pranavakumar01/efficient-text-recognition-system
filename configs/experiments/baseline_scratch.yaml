# ===========================================================================
# Stage 2a -- CONTROL arm of the research experiment.
#
# CNN + BiLSTM + Self-Attention + CTC trained from random initialisation on a
# deliberately small labeled subset (low-label regime).
#
#   python scripts/train_crnn.py --config configs/experiments/baseline_scratch.yaml
#
# This arm and `simclr_finetune.yaml` differ in EXACTLY ONE thing: whether the
# CNN encoder starts from SimCLR weights.  Everything else (data subset, seed,
# epochs, optimiser, augmentation) is identical, which is what makes the
# comparison meaningful.
# ===========================================================================
extends: default.yaml

name: baseline_scratch

data:
  # Low-label regime: only this many labeled training samples are used.
  max_train_samples: 2000

model:
  # Role in the controlled comparison; see docs/RESULTS.md.
  experiment_arm: control
  init_encoder_from: null   # <-- the only difference from the SimCLR arm

train:
  epochs: 25
  batch_size: 32
  learning_rate: 0.0008
  seed: 42
  checkpoint_dir: artifacts/checkpoints/baseline_scratch
