# ===========================================================================
# Default configuration for all ML pipelines.
#
# Experiment files under `configs/experiments/` declare `extends: default.yaml`
# and override only the keys they care about (deep merge).
# See `ml/config.py` for the loader.
# ===========================================================================

name: default

# ---------------------------------------------------------------------------
# Character set used by the CTC head.
#   - index 0 is reserved for the CTC blank and is added by the Charset class
#   - keep this stable: changing it invalidates existing checkpoints
# ---------------------------------------------------------------------------
charset:
  # digits + lowercase + uppercase + punctuation + space
  # The full printable ASCII range (32-126). The earlier 83-character set
  # omitted $ % < > { } | ~ ^ ` = \ and the model physically could not emit
  # them -- fatal for documents containing currency or percentages.
  characters: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  lowercase: false        # if true, labels are lowercased before encoding

# ---------------------------------------------------------------------------
# Image geometry fed to the CNN encoder.
# With height=32 / width=256 the CRNN backbone emits T = width/4 - 1 = 63
# time steps, which bounds the longest decodable label at ~31 characters.
# ---------------------------------------------------------------------------
image:
  height: 32
  # 512 gives T = 512/4 - 1 = 127 time steps, enough for a ~76 character
  # document line. At 256 the cap was ~37 characters, which silently
  # truncated every full sentence during training.
  width: 512
  channels: 1             # 1 = grayscale
  keep_aspect_ratio: true # resize by height then right-pad to `width`
  pad_value: 255          # white padding (images are stored as uint8)

# ---------------------------------------------------------------------------
# Deterministic preprocessing applied before the network (and exposed to the
# UI "Preprocessing Lab" so each stage can be inspected).
# ---------------------------------------------------------------------------
preprocess:
  grayscale: true
  # On by default: photographed pages are rarely square, and a few degrees
  # of skew makes adjacent text lines overlap vertically, which merges a
  # whole page into one row. A no-op below 0.1 degrees.
  deskew: true
  denoise: false
  clahe: false
  sharpen: false
  binarize: none          # none | otsu | adaptive | sauvola
  invert_if_dark: true    # normalise to dark-text-on-light-background
  normalize: true         # scale to [0, 1] then standardise

# ---------------------------------------------------------------------------
# Augmentation used for *supervised* OCR training.  Deliberately mild: text
# identity must survive the transform.
# ---------------------------------------------------------------------------
augment:
  enabled: true
  probability: 0.8
  rotate_deg: 2.0
  shear_deg: 4.0
  scale_jitter: 0.08
  translate_px: 2
  brightness: 0.25
  contrast: 0.25
  gaussian_noise_std: 0.035
  blur_max_sigma: 0.9
  jpeg_quality_min: 45
  erode_dilate: true
  # Never horizontally flip text: it destroys the label.
  horizontal_flip: false

# ---------------------------------------------------------------------------
# Data locations (relative to project root).
# ---------------------------------------------------------------------------
data:
  root: data
  raw_dir: data/raw
  processed_dir: data/processed
  demo_dir: data/demo
  # Manifest-based datasets: each split is a TSV of "<relpath>\t<label>".
  train_manifest: data/processed/synthetic/train.tsv
  val_manifest: data/processed/synthetic/val.tsv
  test_manifest: data/processed/synthetic/test.tsv
  # Unlabeled pool for self-supervised pretraining (one image path per line).
  unlabeled_manifest: data/processed/synthetic/unlabeled.txt
  # Cap the number of *labeled* samples to emulate the low-label regime that
  # motivates self-supervised pretraining.  null = use everything.
  max_train_samples: null

# ---------------------------------------------------------------------------
# CNN + BiLSTM + Self-Attention + CTC recogniser.
# ---------------------------------------------------------------------------
crnn:
  encoder:
    type: crnn_vgg          # crnn_vgg | resnet_small
    channels: [64, 128, 256, 256, 512, 512, 512]
    feature_dim: 512        # channels of the sequence emitted by the encoder
    dropout: 0.1
  sequence:
    rnn_hidden: 256         # per direction, so BiLSTM output = 512
    rnn_layers: 2
    rnn_dropout: 0.2
  attention:
    enabled: true
    heads: 8
    layers: 1
    ff_dim: 1024
    dropout: 0.1
    max_positions: 512      # positional encoding table size

# ---------------------------------------------------------------------------
# SimCLR self-supervised pretraining of the *same* CNN encoder.
# ---------------------------------------------------------------------------
simclr:
  projection_dim: 128
  projection_hidden: 512
  temperature: 0.1
  # OCR-aware view generator: photometric + mild geometric only.
  views:
    brightness: 0.4
    contrast: 0.4
    gaussian_noise_std: 0.06
    blur_max_sigma: 1.4
    rotate_deg: 3.0
    shear_deg: 6.0
    scale_jitter: 0.12
    translate_px: 3
    erode_dilate: true
    jpeg_quality_min: 35
    # Width-wise random crop keeps the same text but changes the margins.
    width_crop_ratio: 0.9

# ---------------------------------------------------------------------------
# Transformer OCR baseline (Hugging Face TrOCR).  Inference only by default:
# fine-tuning TrOCR does not fit in 4 GB of VRAM at a useful batch size.
# ---------------------------------------------------------------------------
trocr:
  # Note on naming: '-printed' was fine-tuned on SROIE receipts, which are
  # ALL CAPS, so it loses letter case on ordinary documents. The IAM-trained
  # '-handwritten' models preserve case and are far better general-purpose
  # document recognisers -- measured at CER 0.061 vs 0.677 on the document
  # benchmark. See docs/RESULTS.md.
  printed_model: microsoft/trocr-small-printed
  handwritten_model: microsoft/trocr-small-handwritten
  # Larger, more accurate, ~1.3 GB download on first use.
  base_model: microsoft/trocr-base-handwritten
  max_new_tokens: 48
  num_beams: 1
  # Block repeated trigrams: without this the decoder loops on out-of-domain
  # crops and emits filler until it hits max_new_tokens, which would make the
  # baseline look far worse than it recognises.
  no_repeat_ngram_size: 3
  allow_download: true

# ---------------------------------------------------------------------------
# Optimisation defaults shared by every trainer.
# ---------------------------------------------------------------------------
train:
  epochs: 20
  batch_size: 32
  optimizer: adamw          # adamw | adam | sgd
  learning_rate: 0.0008
  weight_decay: 0.0001
  scheduler: cosine         # cosine | step | none
  warmup_epochs: 1
  grad_clip: 5.0
  amp: true                 # ignored on CPU
  seed: 42
  num_workers: 0
  log_every: 20
  early_stopping_patience: 6
  checkpoint_dir: artifacts/checkpoints
  monitor: val_cer          # metric used for "best" checkpoint
  monitor_mode: min

# ---------------------------------------------------------------------------
# Decoding / evaluation.
# ---------------------------------------------------------------------------
decode:
  strategy: greedy          # greedy | beam
  beam_width: 10

evaluate:
  batch_size: 32
  report_dir: artifacts/reports
  figure_dir: artifacts/figures
  # Number of warm-up batches discarded before timing inference.
  timing_warmup_batches: 2
